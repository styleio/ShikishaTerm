[package]
name = "shikisha-term"
version = "0.5.1"
edition = "2024"
description = "Run Claude Code, Codex and Gemini side by side and let them hand work to each other. A portable terminal for orchestrating AI CLIs on Windows."
authors = ["styleio"]
license = "MIT"
readme = "README.md"
repository = "https://github.com/styleio/ShikishaTerm"
homepage = "https://github.com/styleio/ShikishaTerm"
keywords = ["terminal", "tui", "ai", "agents", "automation"]
categories = ["command-line-utilities"]
# 配布物に含めないもの (crates.io に出す場合の保険)
exclude = ["logs/", "target/", "docs/demo.gif"]

[[bin]]
name = "SHIKISHA-TERM"
path = "src/main.rs"

[profile.release]
strip = true
lto = true

[dependencies]
aes-gcm = "0.11.0"
anyhow = "1.0.104"
arboard = "3.6.1"
argon2 = "0.5.3"
base64 = "0.23.1"
crossterm = "0.29"
encoding_rs = "0.8.35"
mlua = { version = "0.12.0", features = ["lua54", "vendored"] }
portable-pty = "0.9.0"
qrcode = { version = "0.14.1", default-features = false }
rand = "0.10.2"
regex = "1.13.1"
rfd = { version = "0.17.2", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tao = "0.36.0"
tiny_http = "0.12.0"
unicode-width = "0.2.2"
ureq = { version = "3.3.0", default-features = false, features = ["rustls", "json"] }
vt100 = "0.16"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Globalization", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_Storage_Packaging_Appx", "Win32_System_Console", "Win32_System_LibraryLoader", "Win32_System_Diagnostics_ToolHelp", "Win32_System_ProcessStatus", "Win32_System_IO", "Win32_System_Pipes", "Win32_NetworkManagement_IpHelper", "Win32_Networking_WinSock", "Win32_System_SystemInformation", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_Graphics_Gdi"] }
# wry と同じ版に揃える (ICoreWebView2 の型が一致しないと CDP を呼べない)
webview2-com = "0.38.2"
windows = { version = "0.61.3", features = ["Win32_Foundation"] }
wry = "0.56.0"
zeroize = "1.9.0"

[build-dependencies]
winresource = "0.1.31"

# vt100 0.16.2 panics when a resize strands a full-width character at the row
# edge (row.rs clear_wide / screen.rs text_common index past the end). Every
# Japanese TUI hits that combination eventually, and the reader thread's
# catch_unwind can only answer with a full screen reset — losing the screen
# mid-rally. The vendored copy makes those sites degrade gracefully instead
[patch.crates-io]
vt100 = { path = "vendor/vt100" }
