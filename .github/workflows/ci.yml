name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    # ConPTY を使うので Windows でしか意味のあるテストにならない
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --locked --verbose

      - name: Test
        run: cargo test --locked --verbose

      # A dependency added without rerunning tools/notices.ps1 leaves the
      # download crediting the wrong set of authors. Caught here, it is a line
      # in a pull request; caught at the tag, it is a release already downloaded.
      - name: Third-party notices are current
        shell: pwsh
        run: ./tools/notices.ps1 -Check
