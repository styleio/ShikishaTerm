name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  # The program with a window. It uses ConPTY and WebView2, so it runs only here
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --workspace --locked --verbose

      - name: Test
        run: cargo test --workspace --locked --verbose

      # A page that cannot take its first state is an app that never starts.
      # That failure is reported to the app and to nobody else, so the window
      # just sits on its splash and the log says nothing -- no test here would
      # have caught it, because the page is only a string until a browser runs
      # it. Chrome and node are on this runner already.
      - name: The board comes up when it is handed a state
        run: node tools/check-board.mjs

      # A dependency added without rerunning tools/notices.ps1 leaves the
      # download crediting the wrong set of authors. Caught here, it is a line
      # in a pull request; caught at the tag, it is a release already downloaded.
      - name: Third-party notices are current
        shell: pwsh
        run: ./tools/notices.ps1 -Check

  # The runtime with no window. If this stops passing, the Linux build rots quietly --
  # the crates with a window cannot build on Linux, so this covers core / shared / serve.
  # Named, not `ubuntu-latest`: this is the release a server is recommended to run, so the
  # tests run where the recommendation says, and moving to the next one is a choice made here
  linux:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build -p shikisha-core -p shikisha-shared -p shikisha-serve --locked --verbose

      - name: Test
        run: cargo test -p shikisha-core -p shikisha-shared -p shikisha-serve --locked --verbose

      # Sending a screen as video from a system with no encoder of its own.
      # Off by default, so without this step it would compile on nobody's
      # machine until somebody tried it -- and the binding it links through is
      # generated from headers, which is exactly the kind of thing that rots
      # quietly. libvpx is the only thing it needs
      - name: The VP8 encoder still builds and works
        run: |
          sudo apt-get install -y libvpx-dev
          cargo test -p shikisha-core --features vp8 --locked --verbose

      # What ships is statically linked against musl. The promise that one file runs on every distro
      # rests on it building here
      - name: The static build still links
        run: |
          sudo apt-get update -qq && sudo apt-get install -y musl-tools
          rustup target add x86_64-unknown-linux-musl
          CC_x86_64_unknown_linux_musl=musl-gcc \
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER=musl-gcc \
            cargo build --release -p shikisha-serve --locked \
                        --target x86_64-unknown-linux-musl
          file target/x86_64-unknown-linux-musl/release/shikisha-serve > /tmp/what
          cat /tmp/what
          grep -qE "static-pie linked|statically linked" /tmp/what

      # Check the scripts that hand things out in the shell each one says it is written for.
      # install.sh is piped into whatever sh is on somebody's machine, so it is POSIX;
      # mkpkg / mkrepo only run in CI and locally, so bash is fine
      - name: The scripts are the shell they say they are
        run: |
          sudo apt-get install -y dash shellcheck
          for f in packaging/linux/*.sh; do
            case $(head -1 "$f") in
              *bash) shellcheck --shell=bash "$f"; bash -n "$f" ;;
              *)     shellcheck --shell=sh   "$f"; dash -n "$f" ;;
            esac
            echo "ok $f"
          done

      # Is the public key in the repository really that key?
      # If it is swapped, this stops unless the fingerprint is changed too --
      # and a changed fingerprint shows up in a diff for a person to see
      - name: The archive key is the one we published
        run: |
          gpg --show-keys --with-colons packaging/linux/shikisha-archive-key.asc > /tmp/key
          grep -q "^fpr:::::::::B5B1D1F5C6B984B64632EBD0881F363FBF07A203:" /tmp/key
          gpg --show-keys packaging/linux/shikisha-archive-key.asc

      # Do the contents make a correct .deb and .rpm? Checked where it is known before a tag is pushed
      - name: The packages hold what they claim
        run: |
          sudo apt-get install -y rpm
          mkdir -p /tmp/pkg
          sh packaging/linux/mkpkg.sh              target/x86_64-unknown-linux-musl/release/shikisha-serve v0.0.0 x86_64 /tmp/pkg
          dpkg-deb -c /tmp/pkg/*.deb > /tmp/deb.list
          grep -q usr/bin/shikisha-serve /tmp/deb.list
          grep -q usr/lib/systemd/user/shikisha.service /tmp/deb.list
          rpm -qpl /tmp/pkg/*.rpm > /tmp/rpm.list 2>/dev/null
          grep -q /usr/bin/shikisha-serve /tmp/rpm.list

      # The repository tree. There is no key here, so nothing is signed, but
      # this shows which files come out, where, and under what names
      - name: The repository tree comes out whole
        run: |
          sudo apt-get install -y apt-utils createrepo-c
          bash packaging/linux/mkrepo.sh /tmp/pkg /tmp/repo
          # binary-arm64/Packages is empty here and that is correct: CI builds
          # one architecture. It still has to exist -- apt asks for every
          # architecture the Release names, and a missing one is an error
          for f in apt/dists/stable/Release \
                   apt/dists/stable/main/binary-amd64/Packages \
                   apt/dists/stable/main/binary-arm64/Packages \
                   rpm/repodata/repomd.xml \
                   shikisha-archive-key.asc \
                   index.html; do
            test -f "/tmp/repo/$f" || { echo "missing: $f"; exit 1; }
          done
          test -s /tmp/repo/apt/dists/stable/main/binary-amd64/Packages
          # Is every file Packages points at really there? If this drifts,
          # apt goes to fetch what it was told exists and gets a 404
          awk '/^Filename:/ {print $2}' /tmp/repo/apt/dists/stable/main/binary-amd64/Packages |
            while read -r rel; do
              test -s "/tmp/repo/apt/$rel" || { echo "Packages names a file that is not there: $rel"; exit 1; }
              echo "  points at $rel"
            done
