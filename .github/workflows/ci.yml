name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  # 窓のある本体。ConPTY と WebView2 を使うのでここでしか動かない
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --workspace --locked --verbose

      - name: Test
        run: cargo test --workspace --locked --verbose

      # A dependency added without rerunning tools/notices.ps1 leaves the
      # download crediting the wrong set of authors. Caught here, it is a line
      # in a pull request; caught at the tag, it is a release already downloaded.
      - name: Third-party notices are current
        shell: pwsh
        run: ./tools/notices.ps1 -Check

  # 窓のないランタイム。ここが通らなくなったら Linux 版は静かに腐る——
  # 窓のあるクレートは Linux でビルドできないので、対象は core / shared / serve
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build -p shikisha-core -p shikisha-shared -p shikisha-serve --locked --verbose

      - name: Test
        run: cargo test -p shikisha-core -p shikisha-shared -p shikisha-serve --locked --verbose

      # 配るのは musl の静的リンク。どの distro でも同じ1つのファイルが動く、
      # という約束は、ここで組めることが前提になっている
      - name: The static build still links
        run: |
          sudo apt-get update -qq && sudo apt-get install -y musl-tools
          rustup target add x86_64-unknown-linux-musl
          CC_x86_64_unknown_linux_musl=musl-gcc \
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER=musl-gcc \
            cargo build --release -p shikisha-serve --locked \
                        --target x86_64-unknown-linux-musl
          file target/x86_64-unknown-linux-musl/release/shikisha-serve > /tmp/what
          cat /tmp/what
          grep -qE "static-pie linked|statically linked" /tmp/what

      # インストーラは POSIX sh で書いてある。bash しか無い機械で試すと、
      # 通ったのに配った先で落ちる
      - name: The installer is POSIX sh
        run: |
          sudo apt-get install -y dash shellcheck
          for f in packaging/linux/*.sh; do
            dash -n "$f"
            shellcheck --shell=sh "$f"
          done

      # 中身が正しい .deb と .rpm になるか。タグを打つ前に分かる場所で見る
      - name: The packages hold what they claim
        run: |
          sudo apt-get install -y rpm
          mkdir -p /tmp/pkg
          sh packaging/linux/mkpkg.sh              target/x86_64-unknown-linux-musl/release/shikisha-serve v0.0.0 x86_64 /tmp/pkg
          dpkg-deb -c /tmp/pkg/*.deb > /tmp/deb.list
          grep -q usr/bin/shikisha-serve /tmp/deb.list
          grep -q usr/lib/systemd/user/shikisha.service /tmp/deb.list
          rpm -qpl /tmp/pkg/*.rpm > /tmp/rpm.list 2>/dev/null
          grep -q /usr/bin/shikisha-serve /tmp/rpm.list
