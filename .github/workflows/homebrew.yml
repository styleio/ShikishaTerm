name: Homebrew

# Keeps this project's tap (styleio/homebrew-shikisha-term) on the release a Mac
# is handed, so that
#   brew install --cask styleio/shikisha-term/shikisha-term
# installs what the release page offers. The cask is written from the checksums
# the release carries (packaging/mac/mkcask.sh) and pushed to the tap.
#
# Only a published release moves the tap: a draft may still change or be thrown
# away. A pre-release does not move it either -- the cask is the channel people
# stay on, and the app updates itself beyond it (auto_updates).
#
# Running it by hand (workflow_dispatch) writes the cask for a tag already
# published, for a tap that missed one -- and, with or without a Mac build in
# that tag, checks that the token may still push to the tap
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Published release to write the cask for (e.g. v0.27.0)
        required: true
        type: string

permissions:
  contents: read

# Two releases published close together must not race each other into the tap
concurrency:
  group: homebrew-tap
  cancel-in-progress: false

jobs:
  cask:
    if: github.event_name == 'workflow_dispatch' || (startsWith(github.event.release.tag_name, 'v') && !github.event.release.prerelease)
    runs-on: macos-latest
    env:
      TAG: ${{ inputs.tag || github.event.release.tag_name }}
      TAP: styleio/homebrew-shikisha-term
    steps:
      - uses: actions/checkout@v4

      # A release made without Apple's credentials has no Mac build, and so no
      # cask to write. That is not a fault of this workflow: say so and stop
      - name: The release's Mac checksums
        id: sums
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p sums
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir sums \
              --pattern 'SHIKISHA-TERM-mac-*.dmg.sha256' || true
          if [ ! -f sums/SHIKISHA-TERM-mac-arm64.dmg.sha256 ] || [ ! -f sums/SHIKISHA-TERM-mac-x64.dmg.sha256 ]; then
            echo "::notice::$TAG has no Mac build, so the tap stays where it is"
            echo "mac=no" >> "$GITHUB_OUTPUT"
          else
            echo "mac=yes" >> "$GITHUB_OUTPUT"
          fi

      # Without the token, or with one that may no longer write, the tap would
      # quietly fall behind the releases. Nobody notices that until someone
      # installs an old version, so stop here. Cloned rather than checked out:
      # a tap nothing has been pushed to yet is an empty repository. The dry
      # push asks the server for the right to write, and writes nothing
      - name: The tap, with a token that may push to it
        if: steps.sums.outputs.mac == 'yes' || github.event_name == 'workflow_dispatch'
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [ -z "${HOMEBREW_TAP_TOKEN:-}" ]; then
            echo "::error::HOMEBREW_TAP_TOKEN is not set: the tap cannot follow $TAG"
            exit 1
          fi
          git clone -q "https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/${TAP}.git" tap
          cd tap
          git config user.name "styleio"
          git config user.email "51430844+styleio@users.noreply.github.com"
          git checkout -q -B main
          # A commit of nothing, on no branch: the clone stays as it came
          probe=$(git commit-tree "$(git hash-object -t tree /dev/null)" -m probe)
          if ! git push -q --dry-run origin "$probe:refs/heads/shikisha-probe"; then
            echo "::error::HOMEBREW_TAP_TOKEN may not push to $TAP"
            exit 1
          fi
          echo "the token may push to $TAP"

      # Read by Homebrew's own rules before it goes anywhere: a cask the tap
      # holds and Homebrew refuses breaks the install for everyone
      - name: Write the cask
        if: steps.sums.outputs.mac == 'yes'
        run: |
          mkdir -p tap/Casks
          sh packaging/mac/mkcask.sh "$TAG" sums > tap/Casks/shikisha-term.rb
          cat tap/Casks/shikisha-term.rb
          brew style tap/Casks/shikisha-term.rb

      - name: Push it to the tap
        if: steps.sums.outputs.mac == 'yes'
        run: |
          cd tap
          git add Casks/shikisha-term.rb
          if git diff --cached --quiet; then
            echo "The tap already has $TAG"
            exit 0
          fi
          git commit -m "shikisha-term ${TAG#v}"
          git push origin HEAD:main
