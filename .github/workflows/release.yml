name: Release

# タグを打つと配布用の zip を作って Releases に下書きで添付する。
#   git tag v0.1.0 && git push origin v0.1.0
#
# 手動実行 (workflow_dispatch) は空撃ち用。zip をアーティファクトに置くだけで
# リリースは作らないので、発射前に梱包が通るかを安全に確認できる
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo test --locked

      - name: Build
        run: cargo build --release --locked

      # 展開してすぐ動く形にまとめる。設定ファイルは example のみ同梱する
      # (利用者の config.json / secrets.json を上書きしないため)
      - name: Stage the portable folder
        shell: pwsh
        run: |
          $dir = "dist/SHIKISHA-TERM"
          New-Item -ItemType Directory -Force $dir | Out-Null
          Copy-Item "target/release/SHIKISHA-TERM.exe" $dir
          Copy-Item "Settings.cmd"                        $dir
          Copy-Item "README.md", "README.ja.md", "LICENSE", "SECURITY.md" $dir
          Copy-Item "config.example.json", "secrets.example.json"         $dir
          Copy-Item -Recurse "lang", "profiles", "scripts", "workspaces"  $dir
          New-Item -ItemType Directory -Force "$dir/docs" | Out-Null
          Copy-Item "docs/AUTOMATION.md", "docs/AUTOMATION.ja.md" "$dir/docs"
          # logs/ は初回書き込み時に本体が作るので同梱しない

      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path "dist/SHIKISHA-TERM" -DestinationPath "SHIKISHA-TERM.zip"

      - name: Checksum
        shell: pwsh
        run: |
          (Get-FileHash "SHIKISHA-TERM.zip" -Algorithm SHA256).Hash.ToLower() +
            "  SHIKISHA-TERM.zip" | Set-Content "SHIKISHA-TERM.zip.sha256"

      # 空撃ち: リリースを作らず、中身を確認できる形で置いておく
      - name: Upload as an artifact (dry run)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: SHIKISHA-TERM-dryrun
          path: |
            SHIKISHA-TERM.zip
            SHIKISHA-TERM.zip.sha256
          retention-days: 7

      - name: Publish
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: |
            SHIKISHA-TERM.zip
            SHIKISHA-TERM.zip.sha256
          body: |
            ## Install

            1. Download `SHIKISHA-TERM.zip` below and unzip it anywhere
            2. Run `SHIKISHA-TERM.exe`

            No installer, no admin rights, no API keys. Windows 10/11.

            Verify the download with `SHIKISHA-TERM.zip.sha256` if you like.
