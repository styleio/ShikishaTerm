name: Release

# タグを打つと配布物を作って Releases に下書きで添付する。
#   git tag v0.1.0 && git push origin v0.1.0
#
# 出口は3つ: Windows の zip、Microsoft Store の msix、Linux の静的バイナリ。
# 3つとも同じタグの同じソースから、この1本のワークフローで作る。
#
# 手動実行 (workflow_dispatch) は空撃ち用。成果物をアーティファクトに置くだけで
# リリースは作らないので、発射前に梱包が通るかを安全に確認できる
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo test --workspace --locked

      # Microsoft's newer ConPTY, verified against the hashes pinned in
      # packaging/conpty/redist.json. -Require because a release that quietly
      # lost this is a release where every terminal got slower and started
      # dropping sequences, with nothing anywhere to say why. It runs before
      # the build so build.rs finds it and puts it beside the exe too.
      - name: Fetch the bundled ConPTY
        shell: pwsh
        run: ./tools/conpty.ps1 -Require

      - name: Build
        run: cargo build --release --locked

      # The zip carries the license of everything the binary is built from, and
      # it has to be the licenses of THIS build. Checking rather than rewriting
      # is deliberate: if the committed file were quietly regenerated here, the
      # download and the repository would disagree about what is inside it, and
      # only the download is ever read.
      - name: Third-party notices are current
        shell: pwsh
        run: ./tools/notices.ps1 -Check

      # 展開してすぐ動く形にまとめる。何を同梱するかは dist.list ただ1つが決める
      # (配る側が各自リストを持っていた頃は、静かに食い違った)。
      # 設定ファイルは example のみ同梱する — 利用者の config.json / secrets.json
      # を上書きしないため。logs/ は初回書き込み時に本体が作るので同梱しない
      - name: Stage the portable folder
        shell: pwsh
        run: |
          ./tools/stage.ps1 -Dest "dist/SHIKISHA-TERM" -Package `
                            -Exe "target/release/SHIKISHA-TERM.exe"

      # stage.ps1 skips a pattern that matched nothing, because most of what it
      # carries is optional. These two are not: without them the terminal falls
      # back to the engine in Windows and says so only on a settings screen
      # nobody opens when things merely feel slow. So the packing is checked
      # here rather than trusted.
      - name: The staged folder carries the ConPTY
        shell: pwsh
        run: |
          foreach ($f in 'conpty.dll', 'OpenConsole.exe') {
            $p = "dist/SHIKISHA-TERM/$f"
            if (-not (Test-Path $p)) { throw "$f did not reach the staged folder" }
            Write-Host "$f  $((Get-Item $p).Length) bytes"
          }

      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path "dist/SHIKISHA-TERM" -DestinationPath "SHIKISHA-TERM.zip"

      - name: Checksum
        shell: pwsh
        run: |
          (Get-FileHash "SHIKISHA-TERM.zip" -Algorithm SHA256).Hash.ToLower() +
            "  SHIKISHA-TERM.zip" | Set-Content "SHIKISHA-TERM.zip.sha256"

      # The signature the program checks a fetched update against before it
      # puts it in place (crates/core/src/update.rs). The key exists only in
      # the repository's secrets; the public half is in the source. A release
      # built without the key carries no .sig, and every copy that checks
      # signatures refuses to install it -- so its absence is said loudly
      - name: Sign
        shell: pwsh
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: |
          if (-not $env:UPDATE_SIGNING_KEY) {
            Write-Warning "UPDATE_SIGNING_KEY is not set: the zip goes out unsigned and self-update will refuse it"
            exit 0
          }
          cargo run --release --locked -p shikisha-core --bin sign -- sign SHIKISHA-TERM.zip
          $pub = (Select-String -Path crates/core/src/update.rs -Pattern 'PUBLIC_KEY_HEX: &str = "([0-9a-f]{64})"').Matches[0].Groups[1].Value
          cargo run --release --locked -p shikisha-core --bin sign -- verify SHIKISHA-TERM.zip $pub

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            SHIKISHA-TERM.zip
            SHIKISHA-TERM.zip.sha256
            SHIKISHA-TERM.zip.sig
          retention-days: 7
          if-no-files-found: error

      # The Store copy: the same binary, packaged. Built here rather than on a
      # laptop for the same reason the zip is -- what people install should come
      # from the tagged source, and nowhere else. It goes up unsigned on purpose;
      # Partner Center signs it with Microsoft's own certificate.
      #
      # Skipped until packaging/msix/store.json carries the identity Partner
      # Center assigns when the name is reserved. Before that there is nothing to
      # build a valid package against, and a wrong identity is rejected on upload.
      - name: Store package (MSIX)
        shell: pwsh
        run: |
          $identity = Get-Content packaging/msix/store.json -Raw
          if ($identity -match 'REPLACE') {
            Write-Host "::notice::store.json still has placeholders -- no Store package built"
            "skipped=true" | Out-File $env:GITHUB_ENV -Append
            exit 0
          }
          ./tools/msix.ps1 -Store

      - name: Upload the Store package
        if: env.skipped != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: SHIKISHA-TERM-msix
          path: target/msix/*-store.msix
          retention-days: 30

  # 窓の無いランタイムを、どの distro でも動く1ファイルにする。
  # musl の静的リンクなので glibc の版を問わない —— VPS に置いて動くこと、
  # というのがここでの唯一の約束
  linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            arch: x86_64
            target: x86_64-unknown-linux-musl
          - runner: ubuntu-24.04-arm
            arch: aarch64
            target: aarch64-unknown-linux-musl
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo test -p shikisha-core -p shikisha-shared -p shikisha-serve --locked

      - name: Build
        run: |
          sudo apt-get update -qq && sudo apt-get install -y musl-tools
          rustup target add ${{ matrix.target }}
          cargo build --release --locked -p shikisha-serve --target ${{ matrix.target }}
        # Named per target rather than as a bare CC: a bare one is also handed
        # to the build scripts, which are compiled for this machine and not for
        # what is being built
        env:
          CC_x86_64_unknown_linux_musl: musl-gcc
          CC_aarch64_unknown_linux_musl: musl-gcc
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc

      # 静的でなければ配る意味がない。file が静的リンクと言わなければ、
      # どこかで動的リンクに落ちている
      - name: It is one file that needs nothing
        run: |
          BIN=target/${{ matrix.target }}/release/shikisha-serve
          file "$BIN"
          file "$BIN" | grep -qE "static-pie linked|statically linked"
          "$BIN" --version

      # 同梱するのは本体と service ファイルだけ。service が署名の内側に入るので、
      # インストーラは2つ目のダウンロードをしなくて済む
      - name: Pack
        run: |
          VERSION=${GITHUB_REF_NAME}
          case "$VERSION" in v*) ;; *) VERSION=v0.0.0-dryrun ;; esac
          NAME="shikisha-serve-$VERSION-${{ matrix.arch }}-linux.tar.gz"
          mkdir -p dist
          cp target/${{ matrix.target }}/release/shikisha-serve dist/
          cp packaging/linux/shikisha.service dist/
          tar -czf "$NAME" -C dist shikisha-serve shikisha.service
          sha256sum "$NAME" | tee "$NAME.sha256"
          echo "NAME=$NAME" >> "$GITHUB_ENV"

      - name: Sign
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: |
          if [ -z "${UPDATE_SIGNING_KEY:-}" ]; then
            echo "::warning::UPDATE_SIGNING_KEY is not set: install.sh will refuse this build"
            exit 0
          fi
          cargo run --release --locked -p shikisha-core --bin sign -- sign "$NAME"
          PUB=$(sed -n 's/.*PUBLIC_KEY_HEX: &str = "\([0-9a-f]\{64\}\)".*/\1/p' crates/core/src/update.rs)
          cargo run --release --locked -p shikisha-core --bin sign -- verify "$NAME" "$PUB"

      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}
          path: |
            shikisha-serve-*-linux.tar.gz
            shikisha-serve-*-linux.tar.gz.sha256
            shikisha-serve-*-linux.tar.gz.sig
          retention-days: 7
          if-no-files-found: error

  publish:
    needs: [windows, linux]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: windows
          path: out

      - uses: actions/download-artifact@v4
        with:
          pattern: linux-*
          path: out
          merge-multiple: true

      - run: ls -la out

      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: out/*
          body: |
            ## Which copy do you want?

            **Most people want the Microsoft Store version:**
            **https://apps.microsoft.com/detail/9PB8XQVM87Z0**

            Microsoft signs the Store copy, so Windows raises no warning when it starts,
            and it updates itself.

            **The download below is the portable copy.** Same version, same source, same
            build — but it is not code-signed, so the first run shows
            **"Windows protected your PC"** (SmartScreen). Click **More info → Run anyway**
            to get past it.

            Take this one if you want nothing installed: unzip it anywhere, and delete the
            folder to remove it.

            ## Install (portable)

            1. Download `SHIKISHA-TERM.zip` below and unzip it anywhere
            2. Run `SHIKISHA-TERM.exe`

            No installer, no admin rights, no API keys. Windows 10/11.

            Verify the download with `SHIKISHA-TERM.zip.sha256` if you like.

            ## Linux

            One static binary, no window, serving the board over the network — for a VPS
            or a cloud VM you reach from a browser or a phone.

            ```sh
            curl -fsSL https://raw.githubusercontent.com/styleio/ShikishaTerm/main/packaging/linux/install.sh | sh
            ```

            It checks the checksum and the Ed25519 signature before it installs
            anything, and refuses the download if either does not match. x86_64 and
            aarch64; systemd service file included.
