[package]
name = "shikisha-core"
version = "0.17.0"
edition = "2024"
description = "The runtime: tabs, detection, automation, git, ssh and the servers."
license = "MIT"
repository = "https://github.com/styleio/ShikishaTerm"

# Signs a release in CI with the key the program checks downloads against
# (src/update.rs). Here rather than in the shell crate because it has to build
# wherever a release is built, and the Windows shell does not build on Linux;
# the same crate as the key, so the two sides can never disagree about the
# algorithm. Not part of any download.
[[bin]]
name = "sign"
path = "src/bin/sign.rs"

[dependencies]
shikisha-shared = { path = "../shared" }
aes-gcm = "0.11.0"
anyhow = "1.0.104"
argon2 = "0.5.3"
base64 = "0.23.1"
crossterm = "0.29"
ed25519-dalek = "2"
encoding_rs = "0.8.35"
# Which encoding a changed file is written in when it is not UTF-8: a CSV saved
# by a spreadsheet is Shift_JIS as often as not, and git hands its diff over as
# bytes. The detector made for the library above, so whatever it names is
# something that library can decode
chardetng = "1.0.0"
hkdf = "0.13.0"
mlua = { version = "0.12.0", features = ["lua54", "vendored"] }
p256 = { version = "0.14.0", features = ["ecdh", "ecdsa"] }
# Two-word names for branches nobody has named yet (crates/core/src/worktree.rs).
# Only the word lists and a source of randomness are wanted; the rest of this
# crate is a command-line tool of its own
petname = { version = "3.2.0", default-features = false, features = ["default-words", "default-rng"] }
portable-pty = "0.9.0"
# Undoing the JPEGs the screen relay produces, so they can be compressed as
# video instead (crates/core/src/vframe.rs). Pure Rust, already in the tree
# through the clipboard library, and small: the alternative was a C decoder,
# which the portable build has no room for
zune-core = "0.5.1"
zune-jpeg = "0.5.15"
qrcode = { version = "0.14.1", default-features = false }
rand = "0.10.2"
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive", "rc"] }
serde_json = { version = "1.0.151", features = ["preserve_order"] }
# Telling two texts apart, for `shikisha.diff`. Chosen over running `git diff
# --no-index` because a diff of two strings should not need git on the machine,
# and over writing the algorithm here because "which lines changed" is a solved
# problem with well-known edge cases. Pure Rust with no dependencies of its own,
# so it costs the build nothing
similar = "2.7.0"
sha2 = "0.11.0"
tiny_http = "0.12.0"
unicode-width = "0.2.2"
ureq = { version = "3.3.0", default-features = false, features = ["rustls", "json"] }
# A board reached over HTTPS -- which is what `tailscale serve` puts in front
# of one. The same rustls the http client above already carries, used directly
# because what goes over this line is a WebSocket and a raw byte stream, not a
# request and a response
rustls = { version = "0.23.43", default-features = false, features = ["ring", "std", "tls12", "logging"] }
webpki-roots = "1.0.9"
vt100 = "0.16"


zeroize = "1.9.0"
zip = { version = "5", default-features = false, features = ["deflate"] }
russh = { version = "0.63.2", default-features = false, features = ["ring"] }
russh-sftp = "3.0.0"
tokio = { version = "1.53.1", default-features = false, features = ["rt", "net", "io-util", "time", "sync", "macros"] }

# What only exists away from Windows: the C library every unix has, for the
# handful of questions std does not answer (the local clock, process groups).
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Sending the screen as video instead of as a stream of JPEGs
# (crates/core/src/webrtc.rs). Chosen over webrtc-rs because it holds no IO of
# its own: this app is threads and blocking sockets all the way down, and
# webrtc-rs would have brought a tokio runtime in beside it. 54 crates against
# 207, and nothing can reach the network except through code written here --
# which is also why it cannot quietly ask a STUN server where we are.
# The crypto backend differs per platform: Windows has one in the OS, and
# using it means no OpenSSL and no perl in the build.
[target.'cfg(windows)'.dependencies.str0m]
version = "0.9"
default-features = false
features = ["wincrypto", "sha1"]

[target.'cfg(not(windows))'.dependencies.str0m]
version = "0.9"
default-features = false
features = ["openssl", "vendored", "sha1"]

# What only exists on Windows. Everything above this line builds anywhere,
# which is the whole point of the runtime being its own crate.
[target.'cfg(windows)'.dependencies]
# Read the PATH a new terminal is started with -- the one in the registry, which
# the terminal library uses -- so "is this program installed" is asked of the
# same list the launch will search. Already in the tree through portable-pty
winreg = "0.10.1"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Globalization", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_Storage_Packaging_Appx", "Win32_System_Console", "Win32_System_LibraryLoader", "Win32_System_Diagnostics_ToolHelp", "Win32_System_ProcessStatus", "Win32_System_IO", "Win32_System_JobObjects", "Win32_System_Pipes", "Win32_NetworkManagement_IpHelper", "Win32_Networking_WinSock", "Win32_System_SystemInformation", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_Graphics_Gdi"] }
windows = { version = "0.61.3", features = [
  "Win32_Foundation",
  "UI_Notifications",
  "Services_Store",
  "ApplicationModel",
  "Data_Xml_Dom",
  "Foundation",
  "Foundation_Collections",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_Storage_EnhancedStorage",
  "Win32_Storage_FileSystem",
  "Win32_UI_Shell",
  "Win32_UI_Shell_PropertiesSystem",
  "Win32_UI_WindowsAndMessaging",
] }
