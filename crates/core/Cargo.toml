[package]
name = "shikisha-core"
version = "0.23.1"
edition = "2024"
description = "The runtime: tabs, detection, automation, git, ssh and the servers."
license = "MIT"
repository = "https://github.com/styleio/ShikishaTerm"

# Signs a release in CI with the key the program checks downloads against
# (src/update.rs). Here rather than in the shell crate because it has to build
# wherever a release is built, and the Windows shell does not build on Linux;
# the same crate as the key, so the two sides can never disagree about the
# algorithm. Not part of any download.
[[bin]]
name = "sign"
path = "src/bin/sign.rs"

# A pairing link as a square a phone can read, for anywhere there is no window
# to draw one (crates/core/src/bin/qr.rs). Not part of any download.
[[bin]]
name = "qr"
path = "src/bin/qr.rs"

# Does the reserve keep a program alive when its memory is refused? Limits
# only itself, with a job object, so nothing else on the machine is touched
# (crates/core/src/bin/reserve_probe.rs). Not part of any download.
[[bin]]
name = "reserve_probe"
path = "src/bin/reserve_probe.rs"

# Does the video path reach a browser? Run by hand against a real browser,
# because that is the only thing that can answer it (crates/core/src/bin/video_probe.rs).
# Not part of any download.
[[bin]]
name = "video_probe"
path = "src/bin/video_probe.rs"

# What the ? would answer, asked for real. The flags that hold an AI to a shape
# are each CLI's own, and nothing in the test suite starts an AI
# (crates/core/src/bin/guide_probe.rs). Not part of any download.
[[bin]]
name = "guide_probe"
path = "src/bin/guide_probe.rs"

[features]
# Sending a screen as video from a system that is not Windows.
#
# Off by default, and deliberately: it links against libvpx, which has to be
# on the machine that builds it (`libvpx-dev` on Debian and Ubuntu, `libvpx`
# on the rest). Windows needs none of this -- it has an H.264 encoder of its
# own -- so nothing here changes for anyone building the app.
vp8 = []

[dependencies]
shikisha-shared = { path = "../shared" }
aes-gcm = { workspace = true }
anyhow = { workspace = true }
argon2 = { workspace = true }
base64 = { workspace = true }
crossterm = { workspace = true }
ed25519-dalek = { workspace = true }
encoding_rs = { workspace = true }
# Which encoding a changed file is written in when it is not UTF-8: a CSV saved
# by a spreadsheet is Shift_JIS as often as not, and git hands its diff over as
# bytes. The detector made for the library above, so whatever it names is
# something that library can decode
chardetng = "1.0.0"
hkdf = { workspace = true }
mlua = { workspace = true, features = ["lua54", "vendored"] }
p256 = { workspace = true, features = ["ecdh", "ecdsa"] }
# Two-word names for branches nobody has named yet (crates/core/src/worktree.rs).
# Only the word lists and a source of randomness are wanted; the rest of this
# crate is a command-line tool of its own
petname = { version = "3.2.0", default-features = false, features = ["default-words", "default-rng"] }
portable-pty = { workspace = true }
# Undoing the JPEGs the screen relay produces, so they can be compressed as
# video instead (crates/core/src/vframe.rs). Pure Rust, already in the tree
# through the clipboard library, and small: the alternative was a C decoder,
# which the portable build has no room for
zune-core = "0.5.1"
# Opus, which is what WebRTC carries sound in and the only thing every phone
# plays. Pure Rust on purpose: the reference implementation is C built with
# cmake, and cmake is a tool this repository does not ask anyone to install --
# the same reason the crypto here is not OpenSSL
rusty-opus = "0.9"
zune-jpeg = "0.5.15"
qrcode = { workspace = true, default-features = false }
rand = { workspace = true }
# The record of work handed between AI tabs (`orch`). Bundled, so the program
# carries its own SQLite and needs nothing installed on any machine
rusqlite = { version = "0.40.2", features = ["bundled"] }
regex = { workspace = true }
serde = { workspace = true, features = ["rc"] }
serde_json = { workspace = true }
# Telling two texts apart, for `shikisha.diff`. Chosen over running `git diff
# --no-index` because a diff of two strings should not need git on the machine,
# and over writing the algorithm here because "which lines changed" is a solved
# problem with well-known edge cases. Pure Rust with no dependencies of its own,
# so it costs the build nothing
similar = "2.7.0"
sha2 = { workspace = true }
tiny_http = { workspace = true }
unicode-width = { workspace = true }
ureq = { workspace = true, default-features = false, features = ["rustls", "json"] }
# A board reached over HTTPS -- which is what `tailscale serve` puts in front
# of one. The same rustls the http client above already carries, used directly
# because what goes over this line is a WebSocket and a raw byte stream, not a
# request and a response
rustls = { workspace = true, default-features = false, features = ["ring", "std", "tls12", "logging"] }
webpki-roots = { workspace = true }
vt100 = { workspace = true }


zeroize = { workspace = true }
zip = { workspace = true, default-features = false, features = ["deflate"] }
russh = { workspace = true, default-features = false, features = ["ring"] }
russh-sftp = { workspace = true }
tokio = { workspace = true, default-features = false, features = ["rt", "net", "io-util", "time", "sync", "macros"] }

# What only exists away from Windows: the C library every unix has, for the
# handful of questions std does not answer (the local clock, process groups).

# Sending the screen as video instead of as a stream of JPEGs
# (crates/core/src/webrtc.rs). Chosen over webrtc-rs because it holds no IO of
# its own: this app is threads and blocking sockets all the way down, and
# webrtc-rs would have brought a tokio runtime in beside it. 54 crates against
# 207, and nothing can reach the network except through code written here --
# which is also why it cannot quietly ask a STUN server where we are.
# The cipher suite is the pure-Rust one. The other backends are OpenSSL, which
# wants perl and a C compiler to build, and the operating system's own, which
# on Windows would not agree a single cipher with Chrome (SEC_E_ALGORITHM_MISMATCH
# at the first handshake, found by the end-to-end probe). Pure Rust also keeps
# the Linux build the single static file it is.
str0m = { version = "0.23", default-features = false, features = ["rust-crypto"] }
[target.'cfg(unix)'.dependencies]
libc = "0.2"


# What only exists on Windows. Everything above this line builds anywhere,
# which is the whole point of the runtime being its own crate.
[target.'cfg(windows)'.dependencies]
junction = "2.1.0"
# Read the PATH a new terminal is started with -- the one in the registry, which
# the terminal library uses -- so "is this program installed" is asked of the
# same list the launch will search. Already in the tree through portable-pty
winreg = "0.10.1"
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_Globalization", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_Storage_Packaging_Appx", "Win32_System_Console", "Win32_System_LibraryLoader", "Win32_System_Memory", "Win32_System_Diagnostics_ToolHelp", "Win32_System_ProcessStatus", "Win32_System_IO", "Win32_System_JobObjects", "Win32_System_Pipes", "Win32_System_Power", "Win32_NetworkManagement_IpHelper", "Win32_Networking_WinSock", "Win32_System_SystemInformation", "Win32_System_Threading", "Win32_System_Time", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_Graphics_Gdi"] }
# The macro that makes a Rust type into a COM callback writes `windows_core`
# paths, so the crate has to be here under that name as well (vaudio.rs: the
# only way Windows reports that a process's sound is ready to be taken)
windows-core = "0.61.2"
# Pasting this PC's clipboard into a tab (paste.rs). The same versions the
# window's crate already uses, so nothing new is built: the runtime of a
# program split in two has no window to do it for it
arboard = { workspace = true }
png = { workspace = true }
windows = { workspace = true, features = [
  "Win32_Foundation",
  # Compressing the screen into H.264 with the encoder Windows already has
  # (crates/core/src/vencode.rs). The operating system carries the licence for
  # it too, so nothing is shipped and no terms are taken on
  "Win32_Media_MediaFoundation",
  # Taking the sound of one page -- the process playing it, not this machine
  # (crates/core/src/vaudio.rs). The waiting is an event, which is the one
  # thing the threading feature is here for
  "Win32_Media_Audio",
  "Win32_System_Threading",
  # CreateEventW is gated behind Security, which is where the attributes it
  # takes live even when, as here, there are none
  "Win32_Security",
  "Win32_System_Variant",
  "Win32_System_Ole",
  "UI_Notifications",
  "Services_Store",
  "ApplicationModel",
  "Data_Xml_Dom",
  "Foundation",
  "Foundation_Collections",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_Storage_EnhancedStorage",
  "Win32_Storage_FileSystem",
  "Win32_UI_Shell",
  "Win32_UI_Shell_PropertiesSystem",
  "Win32_UI_WindowsAndMessaging",
] }
# The Store's download and install says how far it is through a handler of
# this crate's type (update.rs). The same version the windows crate brings in
windows-future = "0.2.1"
