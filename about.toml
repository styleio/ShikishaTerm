# lua-src carries two licenses in one file: its own, and Lua's underneath a
# "### Lua license ###" heading. Two licenses in one file read as a poor match
# for either, so the scanner declines it -- and the entire Lua interpreter,
# compiled into this binary, loses its notice. Taking the file whole keeps
# Lua.org's copyright where it belongs.
[lua-src.clarify]
license = "MIT"
[[lua-src.clarify.files]]
path = "LICENSE"
checksum = "bb53bb4136a0ac250ba54c3baf6fb0ee22f33879a696848dc0d0aa64dfa9412d"

# dpi says "Apache-2.0 AND MIT" -- both, not either. The Apache half is in
# LICENSE and is found; the MIT half belongs to the rust-lang/libm routines
# built into the crate, and sits in a file named after libm rather than after
# the license, where scanning does not look. Those routines carry the
# copyrights of half a dozen people, and this is where they are kept.
[dpi.clarify]
license = "Apache-2.0 AND MIT"
[[dpi.clarify.files]]
path = "LICENSE"
license = "Apache-2.0"
checksum = "6dc0e068dcf3a5bc8e054205b85b7720e1d49265bbc64bf515d2cf79197df69a"
[[dpi.clarify.files]]
path = "LICENSE-LIBM-MIT"
license = "MIT"
checksum = "9eff396a99bafd208e7126602420d6864f6066c08b84485a5b032320a9c01997"
